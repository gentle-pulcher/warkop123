<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .feedback-box {
        width: 70vw;
        height: 60vh;
        margin: 60px auto;
        padding: 25px;

        background-color:#333;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
        color: white;

        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .feedback-box h2 {
        text-align: center;
        margin-bottom: 15px;
      }

      .feedback-box input,
      .feedback-box textarea {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: none;
        outline: none;
        background: #444;
        color: white;
        box-sizing: border-box;
      }

      .feedback-box textarea {
        height: 220px;
        resize: none;
      }

      .feedback-box button {
        width: 70%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #cf8e4e;
        color: black;
        font-weight: bold;
        cursor: pointer;
        margin: 0 auto;
      }

      .feedback-box button:hover {
        background: #b8763d;
      }

      .feedback-box form {
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }
      .rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: center;
        gap: 24px; /* ← jarak antar bintang */
        margin-bottom: 15px;
      }

      .rating input {
        display: none;
      }

      .rating label {
        font-size: 30px;
        color: #555;
        cursor: pointer;
      }

      .rating input:checked ~ label,
      .rating label:hover,
      .rating label:hover ~ label {
        color: #cf8e4e;
      }
      .fields {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <a href="checkout.html"
        ><img src="img/cart icon.png" alt="" id="carticon"
      /></a>
      <a href="account.html"
        ><img
          src="Landscape Illustration.jfif"
          alt="User Avatar"
          class="avatar"
      /></a>
      <nav>
        <ul class="nav-list">
          <li>
            <a href="index.html">Home</a> <a href="menu.html">Products</a>
            <a href="galeritoko.html">Galeri</a>
            <a href="testimoni.html">Reviews</a>
            <a href="satrik.html" class="active">Tell Us</a>
            <a href="events.html">Events</a>
            <a href="about.html">About</a>
            <a href="kontak.html">Contacts</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="feedback-box">
        <h2>Rating berapa nichh??</h2>

        <form>
          <div class="fields">
            <input type="text" placeholder="Nama (opsional)"/>

            <textarea placeholder="Tulis saran atau kritik kamu..."></textarea>
          </div>
          <div class="rating">
            <input type="radio" name="star" id="star5" />
            <label for="star5">★</label>

            <input type="radio" name="star" id="star4" />
            <label for="star4">★</label>

            <input type="radio" name="star" id="star3" />
            <label for="star3">★</label>

            <input type="radio" name="star" id="star2" />
            <label for="star2">★</label>

            <input type="radio" name="star" id="star1" />
            <label for="star1">★</label>
          </div>

          <button type="submit">Kirim</button>
        </form>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
