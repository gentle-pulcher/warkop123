.gallery-desc {
  color: #666;

/* GRID FOTO */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  height: 600px;
  overflow-y: scroll;
  padding-right: 10px;
}

.gallery-grid::-webkit-scrollbar {
  display: none;
}

.gallery-grid {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.gallery-card {
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}


.gallery-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.gallery-card:hover img {
  transform: scale(1.1);
}

</head>
