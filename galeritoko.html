<!DOCTYPE html>

<link rel="stylesheet" href="style.css">

<head>
  <meta charset="UTF-8">
  <title>Galeri Toko Tercinta</title>
  <style>
    .gallery-suasanа {
      padding: 50px 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .gallery-title {
      font-size: 30px;
      margin-bottom: 20px;
      text-align: center;
      margin-top: 0;
    }

    .gallery-desc {
      color: #666;
      margin-bottom: 30px;
    }

    /* GRID FOTO */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      height: 600px;
      overflow-y: scroll;
      padding-right: 10px;
    }

    .gallery-grid::-webkit-scrollbar {
      display: none;
    }

    .gallery-grid {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .gallery-card {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }


    .gallery-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.1);
    }

    .page-content {
      background-image: url(bg.png);
      background-size: cover;
      background-position: center;
      padding-top: 40px;
    }

    
    
  </style>
</head>
