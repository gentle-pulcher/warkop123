<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Account</title>
    <style>
        
.account {
  margin-top: 140px; 
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.profile-icon {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}

.account-name {
  font-size: 24px;
  margin-top: 10px;
}

.account-email {
  color: #666;
  font-size: 14px;
}


.account-card {
  width: 320px;
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.account-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 15px;
  border-bottom: 1px solid #eee;
}

.account-row:last-child {
  border-bottom: none;
}

.status.active {
  color: #2ecc71;
  font-weight: 600;
}

/* BUTTONS */
.account-actions {
  display: flex;
  gap: 15px;
  margin-top: 15px;
}

.account-btn {
  padding: 12px 22px;
  background: #cf8e4e;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s ease;
}

.account-btn:hover {
  background: #b8763d;
}

.account-btn.outline {
  background: transparent;
  border: 2px solid #cf8e4e;
  color: #cf8e4e;
}

.account-btn.outline:hover {
  background: red;
  color: white;
  border: 2px solid red;
}

.page-content {
  background-image: url(bg.png);
  background-size: cover;
  background-position: center;
  min-height: 100vh;
}
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="account.html">
            <img src="Landscape Illustration.jfif" alt="User Avatar" class="avatar">
        </a>

        <nav>
            <ul class="nav-list">
                <li>
                    <a href="index.html">Home</a>
                    <a href="menu.html">Products</a>
                    <a href="galeritoko.html">Galeri</a>
                    <a href="testimoni.html">Reviews</a>
                    <a href="satrik.html">Tell Us</a>
                    <a href="events.html">Events</a>
                    <a href="about.html">About</a>
                    <a href="kontak.html">Contacts</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <section class="account">
            <img src="Landscape Illustration.jfif" alt="Profile" class="profile-icon">

            <h2 class="account-name">blabla</h2>
            <p class="account-email">blabla@email.com</p>

            <div class="account-card">
                <div class="account-row">
                    <span>Member since</span>
                    <span>2024</span>
                </div>
                <div class="account-row">
                    <span>Orders</span>
                    <span>12</span>
                </div>
                <div class="account-row">
                    <span>Status</span>
                    <span class="status active">Active</span>
                </div>
            </div>

            <div class="account-actions">
                <button class="account-btn">Edit Profile</button>
                <button class="account-btn outline">Logout</button>
            </div>
        </section>
    </main>

</body>
</html>
